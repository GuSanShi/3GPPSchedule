name: Moyu endpoint probe
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          MOYU_KEY: ${{ secrets.MOYU_API_KEY }}
        run: |
          {
            echo "=== DNS ==="
            getent hosts www.moyu.info || echo "DNS FAILED"
            echo "=== /v1/models ==="
            curl -s -o /tmp/m.txt -w "HTTP:%{http_code} time:%{time_total}\n" --max-time 30 \
              -H "Authorization: Bearer $MOYU_KEY" https://www.moyu.info/v1/models || echo "curl failed"
            head -c 200 /tmp/m.txt || true
            echo
            echo "=== chat ==="
            curl -s -o /tmp/c.txt -w "HTTP:%{http_code} time:%{time_total}\n" --max-time 60 \
              -H "Authorization: Bearer $MOYU_KEY" -H "Content-Type: application/json" \
              -d '{"model":"DeepSeek-V4.1-flash","messages":[{"role":"user","content":"Reply with JSON {\"ok\":true}"}],"response_format":{"type":"json_object"},"max_tokens":20}' \
              https://www.moyu.info/v1/chat/completions || echo "curl failed"
            head -c 300 /tmp/c.txt || true
          } > moyu-probe.txt
          cat moyu-probe.txt
      - name: Commit
        run: |
          git config user.name probe-bot
          git config user.email bot@users.noreply.github.com
          git add moyu-probe.txt
          git commit -m "chore: moyu probe [skip ci]" || echo nothing
          git push || echo push-failed
