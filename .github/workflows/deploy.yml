name: Build and Deploy Schedule

on:
  # GitHub-side cron re-enabled 2026-11-09.  The old "stuck pending" symptom
  # was `cancel-in-progress: true` killing every run that outlived the next
  # tick while slow FTP retries made runs take hours.  Timeouts shortened in
  # downloader.py and concurrency no longer cancels, so runs can finish.
  # Times are UTC (22:00 UTC = 07:00 Beijing/Jeju next day).
  schedule:
    - cron: '0 22 * * 0-4'
    - cron: '0 12 * * 1-5'

  repository_dispatch:
    types: [cronjob_trigger] # cron-job.org에서 보낼 이벤트 이름

  workflow_dispatch:
    inputs:
      action:
        description: '실행할 동작 선택'
        type: choice
        default: check-build-deploy
        options:
          - check-build-deploy  # 변경 감지 후 변경시에만 빌드/배포
          - build-deploy        # FTP 체크 생략, 캐시 유지한 채 빌드/배포 (generator.py만 변경시 유용)
          - force-deploy        # 캐시 초기화 후 빌드/배포
          - deploy-only         # 빌드 없이 현재 docs/ 그대로 배포

# Least privilege: only the jobs that publish get write access.
permissions:
  contents: read

concurrency:
  group: schedule-deploy
  cancel-in-progress: false

jobs:
  # ── Job 1: Lightweight FTP check (~20 seconds) ──────────────
  check:
    permissions:
      contents: read
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.inputs.action == 'check-build-deploy'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      extra_files_artifact: ${{ steps.detect.outputs.extra_files_artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      # State is read from docs/.schedule_state.json (committed in repo)
      - name: Check for FTP updates
        id: detect
        run: uv run python check_update.py

      # A cache miss is downloaded once by check and passed to build. The
      # committed repository cache remains the long-term source of truth.
      - name: Upload extra-file transfer
        if: steps.detect.outputs.extra_files_artifact == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extra-files-${{ github.run_id }}
          path: downloads/.extra_files_transfer/
          include-hidden-files: true
          if-no-files-found: error

  # ── Job 2: Full build & deploy ──────────────────────────────
  # Runs when:
  #   - check detected changes (check-build-deploy)
  #   - build-deploy selected (skip check, reuse cache)
  #   - force-deploy selected (reset cache, full rebuild)
  build-and-deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    needs: check
    if: |
      always() &&
      (needs.check.outputs.changed == 'true' ||
       github.event.inputs.action == 'build-deploy' ||
       github.event.inputs.action == 'force-deploy')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download extra-file transfer
        if: needs.check.outputs.extra_files_artifact == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extra-files-${{ github.run_id }}
          path: downloads/.extra_files_transfer/

      - name: Apply extra-file transfer
        if: needs.check.outputs.extra_files_artifact == 'true'
        shell: bash
        run: |
          mkdir -p downloads/extra_files
          cp downloads/.extra_files_transfer/.extra_files_state.json docs/.extra_files_state.json
          find downloads/.extra_files_transfer -maxdepth 1 -type f \
            ! -name '.extra_files_state.json' \
            -exec cp -f {} downloads/extra_files/ \;

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      # ── LLM Cache: restore → run → save ──
      # Cache key uses run_id so every run saves a new snapshot.
      # restore-keys prefix fetches the most recent previous snapshot.
      # Cache is NOT OS/Python dependent — it depends on prompt version,
      # day, time block, main rooms, source content, and LLM model,
      # all of which are hashed internally by session_parser.py.
      - name: Restore LLM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/
          key: llm-cache-${{ github.run_id }}
          restore-keys: |
            llm-cache-

      # force-deploy: wipe cached LLM results and the committed external-file
      # cache so every configured extra file is fetched again.
      - name: Reset caches (force-deploy)
        if: github.event.inputs.action == 'force-deploy'
        run: |
          rm -rf .cache/*
          rm -rf downloads/extra_files
          rm -f docs/.extra_files_state.json
          rm -rf docs/slot_state

      - name: Run schedule parser
        env:
          # Fallback key only; LLM_API_KEY below takes precedence.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Public OpenAI-compatible endpoint used for the LLM parsing step.
          # deepseek_llm.py prefers LLM_API_KEY + LLM_BASE_URL + LLM_MODEL.
          LLM_API_KEY: ${{ secrets.MOYU_API_KEY }}
          LLM_BASE_URL: https://www.moyu.info/v1
          LLM_MODEL: DeepSeek-V4.1-flash
          SPLIT_SUBITEMS: '1'  # keep sub-item granularity (matches the published chart)
          SCHEDULE_CONTACT_NAME: 846371094
          SCHEDULE_CONTACT_EMAIL: 846371094@qq.com
        run: uv run python main.py

      - name: Check for output
        id: output
        run: |
          if [ -f docs/index.html ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.output.outputs.has_output == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if [ -n "$(find downloads/extra_files -type f -print -quit 2>/dev/null)" ]; then
            git add downloads/extra_files/
          fi
          git diff --cached --quiet || git commit -m "Update schedule $(date +%Y-%m-%d_%H:%M) [skip ci]"
          git push

      - name: Setup Pages
        if: steps.output.outputs.has_output == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        if: steps.output.outputs.has_output == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.output.outputs.has_output == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # ── Job 3: Deploy-only (no rebuild, just push existing docs/) ──
  deploy-only:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event.inputs.action == 'deploy-only'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
