name: DeepSeek endpoint probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official DeepSeek
        env:
          K: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "key len=${#K}"
          echo "--- DNS ---"
          getent hosts api.deepseek.com || echo "DNS FAILED"
          echo "--- /v1/models ---"
          curl -s -o /tmp/m.txt -w "HTTP:%{http_code} time:%{time_total}\n" --max-time 30 \
            -H "Authorization: Bearer $K" https://api.deepseek.com/v1/models || echo "curl failed"
          head -c 300 /tmp/m.txt || true
          echo
          echo "--- chat (deepseek-flash) ---"
          curl -s -o /tmp/c.txt -w "HTTP:%{http_code} time:%{time_total}\n" --max-time 60 \
            -H "Authorization: Bearer $K" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-flash","messages":[{"role":"user","content":"Reply with JSON {\"ok\":true}"}],"max_tokens":10,"response_format":{"type":"json_object"}}' \
            https://api.deepseek.com/v1/chat/completions || echo "curl failed"
          head -c 400 /tmp/c.txt || true
