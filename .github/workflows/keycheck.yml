name: Key check
on:
  workflow_dispatch:
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Hash secret
        env:
          K: ${{ secrets.MOYU_API_KEY }}
        run: |
          echo "len=${#K}"
          printf '%s' "$K" | sha256sum
          printf '%s' "${K:0:6}...${K: -4}" | sed 's/./&/g'
